<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minter Wizard Layout</title>
    <!-- Tailwind CSS for the classes you used -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* Aapke classes ke liye zaroori colors aur variables */
            --background: 0 0% 0%;
            --foreground: 0 0% 100%;
            --surface: #050505;
            --primary: #ffffff;
        }

        body {
            background-color: oklch(0% 0 0); /* Pure black base */
        }

        /* Star field animation setup */
        .minter-star-field {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, #fff 1px, transparent 1px);
            background-size: 50px 50px; /* Small stars */
            opacity: 0.2;
        }

        .minter-star-zoom {
            transform: scale(var(--universe-star-zoom));
            transition: transform 0.5s ease-out;
        }

        /* Layer styling for the smooth blurs */
        .minter-smooth-blur-layer {
            position: absolute;
            inset: 0;
            backdrop-filter: blur(var(--smooth-blur-amount));
            mask-image: var(--smooth-blur-mask);
            -webkit-mask-image: var(--smooth-blur-mask);
        }

        .minter-smooth-blur {
            position: absolute;
            width: 100%;
            height: var(--smooth-blur-height);
            background: var(--smooth-blur-background-gradient);
            pointer-events: none;
        }
    </style>
</head>

<!-- EXACT DITTO START -->
<body class="min-h-screen bg-background font-sans text-foreground antialiased">
        <div hidden="">
        <!--$-->
        <!--/$-->
        </div>
        <main class="minter-wizard relative min-h-screen overflow-hidden bg-surface text-primary">
            <div class="minter-star-zoom" style="--universe-star-zoom:2.45">
                <div class="minter-star-field" aria-hidden="true"></div>
            </div>
            <canvas class="absolute inset-0 z-[1] h-full w-full " aria-label="mint progress orbit"></canvas>
            <div class="minter-blur-veil" aria-hidden="true">
                <div class="minter-smooth-blur minter-smooth-blur-top" style="--smooth-blur-height:6%;--smooth-blur-background-gradient:linear-gradient(to top, transparent, oklch(0% 0 0 / 0.01))">
                    <span class="minter-smooth-blur-layer" style="--smooth-blur-amount:12.0px;--smooth-blur-mask:linear-gradient(to bottom, rgba(0,0,0,0) 0.000%, #000 0.000%, #000 16.667%, rgba(0,0,0,0) 50.000%)"></span>
                    <span class="minter-smooth-blur-layer" style="--smooth-blur-amount:11.7px;--smooth-blur-mask:linear-gradient(to bottom, rgba(0,0,0,0) 0.000%, #000 16.667%, #000 33.333%, rgba(0,0,0,0) 66.667%)"></span>

                    <span class="minter-smooth-blur-layer" style="--smooth-blur-amount:1.9px;--smooth-blur-mask:linear-gradient(to bottom, rgba(0,0,0,0) 16.667%, #000 50.000%, #000 66.667%, rgba(0,0,0,0) 100.000%)"></span>

                    <span class="minter-smooth-blur-layer" style="--smooth-blur-amount:0.0px;--smooth-blur-mask:linear-gradient(to bottom, rgba(0,0,0,0) 50.000%, #000 83.333%, #000 100.000%, rgba(0,0,0,0) 100.000%)"></span>
                </div>
                <div class="minter-smooth-blur minter-smooth-blur-bottom" style="--smooth-blur-height:6%;--smooth-blur-background-gradient:linear-gradient(to bottom, transparent, oklch(0% 0 0 / 0.01))">
                    <span class="minter-smooth-blur-layer" style="--smooth-blur-amount:12.0px;--smooth-blur-mask:linear-gradient(to top, rgba(0,0,0,0) 0.000%, #000 0.000%, #000 16.667%, rgba(0,0,0,0) 50.000%)"></span>
                    <span class="minter-smooth-blur-layer" style="--smooth-blur-amount:11.7px;--smooth-blur-mask:linear-gradient(to top, rgba(0,0,0,0) 0.000%, #000 16.667%, #000 33.333%, rgba(0,0,0,0) 66.667%)"></span>
                    <span class="minter-smooth-blur-layer" style="--smooth-blur-amount:10.1px;--smooth-blur-mask:linear-gradient(to top, rgba(0,0,0,0) 0.000%, #000 33.333%, #000 50.000%, rgba(0,0,0,0) 83.333%)"></span>
                    <span class="minter-smooth-blur-layer" style="--smooth-blur-amount:1.9px;--smooth-blur-mask:linear-gradient(to top, rgba(0,0,0,0) 16.667%, #000 50.000%, #000 66.667%, rgba(0,0,0,0) 100.000%)"></span>
                    <span class="minter-smooth-blur-layer" style="--smooth-blur-amount:0.3px;--smooth-blur-mask:linear-gradient(to top, rgba(0,0,0,0) 33.333%, #000 66.667%, #000 83.333%, rgba(0,0,0,0) 100.000%)"></span>
                    <span class="minter-smooth-blur-layer" style="--smooth-blur-amount:0.0px;--smooth-blur-mask:linear-gradient(to top, rgba(0,0,0,0) 50.000%, #000 83.333%, #000 100.000%, rgba(0,0,0,0) 100.000%)"></span>
                </div>
            </div>

            <!-- Content Area (Yahan aap apna content daal sakte hain) -->
            <div class="relative z-10 flex items-center justify-center h-screen">
                <h1 class="text-white text-2xl font-light tracking-widest opacity-50">INITIALIZING UNIVERSE...</h1>
            </div>
        </main>
</body>
